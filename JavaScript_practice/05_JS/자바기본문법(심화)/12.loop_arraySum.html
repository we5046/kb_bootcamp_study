<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let arr = [10, 20, 30, 40, 50];

        function add(arg1) {
            let sum = 0;
            for (let i = 0; i < arg1.length; i++) {
                sum += arg1[i];
            }
            return sum;
        }
        alert(add(arr));
    </script>
</body>
