<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        const r1 = 10;
        function circle(k) {
            let radius = k;
            // PI * r * r = 원의 넓이
            return radius * radius * Math.PI;
        }
        alert(circle(r1));
    </script>
</body>

</html>
