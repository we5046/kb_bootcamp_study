<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let arr = [10, 20, 30, 40, 50];
        console.log(arr.length);

        var cnt = 0;
        while (true) {
            if (cnt == arr.length)
                break;

            alert(cnt + ": " + arr[cnt]);
            cnt++;
        }

    </script>
</body>

</html>
