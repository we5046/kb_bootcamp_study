<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        window.onload = function () {
            let all = document.querySelectorAll('h1');
            for (let k of all) {
                k.textContent = 'From JavaScript';
                k.style.backgroundColor = 'olive';
                k.style.color = 'pink';
            }
        }
    </script>
</head>

<body>
    <h1>Header</h1>
    <h1>Header</h1>
    <h1>Header</h1>
</body>

</html>
