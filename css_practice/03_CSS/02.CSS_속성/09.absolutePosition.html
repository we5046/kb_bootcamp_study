<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #container {
            width: 500px;
            height: 300px;
            border: 3px sold black;
            position: relative;
        }

        .circle {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }

        div#red {
            background-color: red;
            left: 0px;
            top: 0px;
        }

        div#green {
            background-color: green;
            right: 0px;
            top: 0px;
        }

        div#blue {
            background-color: red;
        }

        div#yellow {
            background-color: red;
        }
    </style>
</head>

<body>
    <h1>Dummy Text</h1>
    <div id="container">
        <div id="red" class="circle"></div>
        <div id="green" class="circle"></div>
        <div id="blue" class="circle"></div>
        <div id="yellow" class="circle"></div>
    </div>
    <h1>Dummy Text</h1>
</body>

</html>
